services:
  app:
    image: ghcr.io/owner/repository:developer
    container_name: laravel_skeleton_developer
    restart: unless-stopped
    init: true
    pull_policy: always
    mem_limit: 1g
    cpus: 1.0
    env_file:
      - .env.developer
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      CACHE_LIMITER: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi pada environment stack Portainer}
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_CACHE_DB: "1"
    ports:
      - "8089:8080"
    volumes:
      - app_storage:/app/storage
    networks:
      - app-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  app_storage:
    name: laravel_skeleton_developer_storage

networks:
  app-network:
    external: true
